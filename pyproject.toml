[project]
name = "dsns"
version = "1.1.0"
authors = [
    {name = "Joshua Smailes", email = "joshua.smailes@cs.ox.ac.uk"},
]
description = "An event-based network simulator optimized for federated and deep-space satellite networks."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
    "PyAstronomy",
    "sgp4",
    "networkit",
    "pyrender",
    "trimesh",
    "pillow",
    "numpy",
    "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-argparse>=0.6",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/ssloxford/dsns"
Issues = "https://github.com/ssloxford/dsns/issues"

[tool.setuptools.package-data]
dsns = [
    "data/*.txt",
    "web_visualizer/static/*.html",
    "web_visualizer/static/css/*",
    "web_visualizer/static/js/*",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
